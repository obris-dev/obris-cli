[project]
name = "obris-cli"
version = "0.4.0"
description = "Save, organize, and access your knowledge from the command line"

requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Obris", email = "dev@obris.ai" }]
keywords = ["obris", "cli", "knowledge-management", "ai", "mcp", "selfhosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.0",
    "requests>=2.28",
]

[project.scripts]
obris = "obris.cli:cli"

[project.urls]
Homepage = "https://obris.ai"
Repository = "https://github.com/obris-dev/obris"
Documentation = "https://docs.obris.ai"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obris"]
